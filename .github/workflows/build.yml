name: Build Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # macOS: convert PNG → ICNS using sips + iconutil (always available on macOS)
      - name: Create icon.icns (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p build/icon.iconset
          sips -z 16   16   build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64   64   build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512  512  build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          cp build/icon.png build/icon.iconset/icon_512x512.png
          cp build/icon.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      # Windows: use png-to-ico npm package (no system tools needed)
      - name: Create icon.ico (Windows)
        if: matrix.platform == 'win'
        run: npx png-to-ico build/icon.png > build/icon.ico

      - name: Build (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skybook-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
