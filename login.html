<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · SkyBook</title>
<link rel="icon" type="image/png" href="https://agfrphupwdcjgugvpiuj.supabase.co/storage/v1/object/public/SkyBook/SkyBook.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/skybook.css?v=20260929-skytrack">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#092d52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkyBook">
<link rel="apple-touch-icon" href="https://agfrphupwdcjgugvpiuj.supabase.co/storage/v1/object/public/SkyBook/SkyBook.png">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</head>
<body>
  <main class="adm-login">
    <section class="adm-login-card" aria-labelledby="skybookLoginTitle">
      <span class="sb-wordmark" style="font-size:34px"><img src="https://agfrphupwdcjgugvpiuj.supabase.co/storage/v1/object/public/SkyBook/SkyBook.png" alt="" aria-hidden="true" onerror="this.hidden=true"><span>Sky<em>Book</em></span></span>
      <h1 id="skybookLoginTitle">Sign in</h1>
      <p id="skybookLoginSubtitle">Reservations, bookings and reports for True Travel and Iventure.</p>

      <div class="adm-note err" id="authStatus" hidden></div>

      <form id="loginForm" class="adm-form">
        <label class="adm-field">
          <span>USERNAME</span>
          <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label class="adm-field">
          <span>PASSWORD</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="adm-btn" type="submit">Sign in</button>
      </form>

      <form id="changePasswordForm" class="adm-form" hidden>
        <p class="adm-note info">Your account needs a new password before you can continue. Choose something secure you have not used before.</p>
        <label class="adm-field">
          <span>NEW PASSWORD</span>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        </label>
        <label class="adm-field">
          <span>CONFIRM PASSWORD</span>
          <input id="confirmPassword" type="password" autocomplete="new-password" required>
        </label>
        <button class="adm-btn" type="submit">Set new password</button>
      </form>

      <p class="adm-login-foot">SkyBook by Aero Digital</p>
    </section>
  </main>

  <script src="assets/js/shared.js?v=20260929-skytrack"></script>
  <script src="assets/js/booking-shared.js?v=20260929-skytrack"></script>
  <script src="assets/js/skybook-login.js?v=20260929-skytrack"></script>
</body>
</html>
