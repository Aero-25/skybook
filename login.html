<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyBook Secure Sign In</title>
<link rel="icon" type="image/png" href="https://zegfirgyhdjyehvhlrnh.supabase.co/storage/v1/object/public/SkyBook/SkyBook.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/booking.css?v=20260522-visual-refresh">
</head>
<body class="booking-body skybook-auth-page">
  <main class="skybook-login-shell">
    <section class="skybook-login-card skybook-login-card-solo" aria-labelledby="skybookLoginTitle">
      <div class="skybook-login-atmosphere" aria-hidden="true">
        <span class="skybook-login-orb skybook-login-orb-one"></span>
        <span class="skybook-login-orb skybook-login-orb-two"></span>
        <span class="skybook-login-orb skybook-login-orb-three"></span>
      </div>

      <div class="skybook-login-content">
        <div class="skybook-login-hero">
          <div class="skybook-auth-brand">
            <img class="admin-brand-mark admin-brand-mark-image" src="https://zegfirgyhdjyehvhlrnh.supabase.co/storage/v1/object/public/SkyBook/SkyBook.png" alt="SkyBook logo">
            <div>
              <p class="toolbar-eyebrow">SkyBook Enterprise</p>
              <span class="booking-chip">Production Workspace</span>
            </div>
          </div>
          <div class="skybook-login-copy">
            <h1 id="skybookLoginTitle">Secure operations sign in</h1>
            <p id="skybookLoginSubtitle" style="margin-top:6px;font-size:14px;opacity:.65" hidden></p>
          </div>
        </div>

        <form id="loginForm" class="booking-form-grid skybook-login-form">
          <label class="booking-field-full">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" placeholder="Email or username" required>
          </label>
          <label class="booking-field-full">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="Enter password" required>
          </label>
          <div class="booking-field-full">
            <button class="booking-button" type="submit">Sign In</button>
          </div>
        </form>

        <form id="changePasswordForm" class="booking-form-grid skybook-login-form" hidden>
          <div class="booking-field-full" style="margin-bottom:4px">
            <p style="font-size:13px;opacity:.75;line-height:1.5">Your account requires a new password before you can continue. Choose something secure that you haven't used before.</p>
          </div>
          <label class="booking-field-full">
            <span>New password</span>
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
          </label>
          <label class="booking-field-full">
            <span>Confirm password</span>
            <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat new password" required>
          </label>
          <div class="booking-field-full">
            <button class="booking-button" type="submit">Set New Password</button>
          </div>
        </form>

        <div class="status-banner" id="authStatus" hidden></div>
      </div>
    </section>
  </main>

  <script src="assets/js/shared.js?v=20260408tourtypes"></script>
  <script src="assets/js/booking-shared.js?v=20260421-enterprise-polish"></script>
  <script src="assets/js/skybook-login.js?v=20260527-mustchange"></script>
</body>
</html>
